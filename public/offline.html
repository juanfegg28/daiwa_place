<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0c0f">
<title>DaiwaPlace · sin conexión</title>
<style>
  html,body{height:100%;margin:0;background:#0c0c0f;color:#e5e5e5;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:96px;height:96px;border-radius:50%;margin-bottom:20px;opacity:.95}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 22px;color:#9a9aa5;max-width:320px;line-height:1.5;font-size:15px}
  button{background:#9f1239;color:#fff;border:0;border-radius:999px;padding:12px 26px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Sin conexión</h1>
  <p>No hay internet por ahora. Revisa tu Wi-Fi o tus datos y vuelve a intentarlo.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
